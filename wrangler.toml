# Ergonia blog: a static site served through a Workers Assets binding.
#
# The whole site is generated by `npm run build` into ./dist. Requests
# are served straight from the Assets binding; the Worker's request
# handler is not even invoked for known asset paths. `not_found_handling`
# returns our own /404.html rather than the default single-page-app
# fallback (this is not a SPA).
#
# The custom domain block auto-provisions DNS for blog.ergonia.works on
# the ergonia.works zone: no manual DNS record, no manual TLS cert.

name = "ergonia-blog"
main = "src/worker.js"
compatibility_date = "2025-01-15"

# Kept alive as a fallback / pre-prod endpoint (same pattern as ergonia).
workers_dev = true

[assets]
directory = "./dist"
not_found_handling = "404-page"

[[routes]]
pattern = "blog.ergonia.works"
custom_domain = true
